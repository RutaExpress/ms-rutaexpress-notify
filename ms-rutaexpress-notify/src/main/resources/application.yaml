server:
  port: 8083

spring:
  application:
    name: ms-rutaexpress-notify
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  notify:
    dlq-alert:
      enabled: true   # false = no consumir las DLQ (los fallidos quedan visibles en RabbitMQ)        