server:
  port: 8083

spring:
  application:
    name: ms-rutaexpress-notify
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual # CRÍTICO PARA LA RÚBRICA

rabbitmq:
  queues:
    email: q.cmd.email
    email-dlq: q.cmd.email.dlq
  exchanges:
    cmd: cmd.topic
    dlx: cmd.dead.dlx
  routing-keys:
    email: routing.key.email